<section id="contacto" class="contact container">
  <div class="contact__box" appReveal>
    <div class="contact__content">
      <h2 class="section-title">Contacto</h2>
      <p>¿Quieres saber más sobre mis proyectos o mi experiencia?<br>Escríbeme y te responderé lo antes posible.</p>
      <div class="contact__actions">
        <a class="btn" [href]="perfil.cv" download>
          <img src="assets/icons/download.svg" alt="" aria-hidden="true"> Descargar CV
        </a>
        <a class="btn" [href]="perfil.whatsapp" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/whatsapp.svg" alt="" aria-hidden="true"> Escribir por WhatsApp
        </a>
      </div>
    </div>
  </div>
</section>
